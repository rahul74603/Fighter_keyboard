name: Build APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Errors are surfaced as check annotations so they can be read without logs.
      - name: Report build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E "^(e: |w: ).*|error:|FAILURE:|What went wrong|Caused by|Execution failed|> Task .*FAILED" build.log | head -40 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed -e 's/%/%25/g' | cut -c1-900)
              echo "::error::$safe"
            done
          fi

      # Tag v* pushes also publish a ready-to-install APK on the Releases page.
      - name: Publish release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "fighter-study-keyboard-${GITHUB_REF_NAME}.apk"
          gh release create "${GITHUB_REF_NAME}" "fighter-study-keyboard-${GITHUB_REF_NAME}.apk" \
            --title "Fighter Study Keyboard ${GITHUB_REF_NAME}" \
            --notes "Debug APK. Android 5.0+ . Install ke liye: file download karo, install karo, phir app me 1. Enable keyboard -> 2. Choose keyboard."

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fighter-study-keyboard-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
